name: Preview

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  delete:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: service-a

jobs:
  preview:
    if: github.event_name != 'delete' || github.event.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve branch and event
        id: meta
        uses: actions/github-script@v7
        with:
          script: |
            const isMainPush = context.eventName === 'push' && context.ref === 'refs/heads/main';
            const isDelete = context.eventName === 'delete';
            const isClosedPr = context.eventName === 'pull_request' && context.payload.action === 'closed';
            const branch = isDelete
              ? context.ref.replace('refs/heads/', '')
              : (context.payload.pull_request?.head?.ref || context.ref.replace('refs/heads/', ''));
            core.setOutput('is_main_push', isMainPush ? 'true' : 'false');
            core.setOutput('event', isDelete || isClosedPr ? 'teardown' : 'deploy');
            core.setOutput('branch', branch);
            core.setOutput('sha', context.payload.pull_request?.head?.sha || context.sha);

      - name: Configure AWS credentials
        if: steps.meta.outputs.event == 'deploy'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.meta.outputs.event == 'deploy'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.meta.outputs.event == 'deploy'
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          SHORT_SHA="${{ steps.meta.outputs.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          if [ "${{ steps.meta.outputs.is_main_push }}" = "true" ]; then
            TAG=main
          else
            TAG="sha-${SHORT_SHA}"
          fi
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"

      - name: Orchestrate preview
        if: steps.meta.outputs.is_main_push != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'orchestrate.yml',
              ref: 'main',
              inputs: {
                event: '${{ steps.meta.outputs.event }}',
                source_repo: context.repo.repo,
                branch: '${{ steps.meta.outputs.branch }}',
                git_sha: '${{ steps.meta.outputs.sha }}',
              },
            });
